<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#14222d">
  <title>Home V2 &mdash; AI Olly Prototype</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="home-v2.css">
</head>
<body>

<!-- ── SVG Icon Sprites ──────────────────────────────────────────────────── -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">

  <symbol id="ico-bed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 20V10a2 2 0 012-2h16a2 2 0 012 2v10M2 20h20M2 14h20"/>
    <path d="M6 8V5M18 8V5"/>
  </symbol>

  <symbol id="ico-services" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/>
    <rect x="9" y="3" width="6" height="4" rx="1"/>
    <path d="M9 12h6M9 16h4"/>
  </symbol>

  <symbol id="ico-nearme" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0118 0z"/>
    <circle cx="12" cy="10" r="3"/>
  </symbol>

  <symbol id="ico-bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/>
    <path d="M13.73 21a2 2 0 01-3.46 0"/>
  </symbol>

  <symbol id="ico-routes" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="6" cy="6" r="3"/>
    <circle cx="18" cy="18" r="3"/>
    <path d="M6 9v3a6 6 0 006 6h3"/>
  </symbol>

  <symbol id="ico-help" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
  </symbol>

  <symbol id="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="4"/>
    <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
  </symbol>

  <symbol id="ico-cloud-rain" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 17.58A5 5 0 0018 8h-1.26A8 8 0 104 15.25"/>
    <line x1="8" y1="19" x2="8" y2="21"/>
    <line x1="8" y1="13" x2="8" y2="15"/>
    <line x1="16" y1="19" x2="16" y2="21"/>
    <line x1="16" y1="13" x2="16" y2="15"/>
    <line x1="12" y1="21" x2="12" y2="23"/>
    <line x1="12" y1="15" x2="12" y2="17"/>
  </symbol>

  <symbol id="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
  </symbol>

  <symbol id="ico-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
    <polyline points="9 22 9 12 15 12 15 22"/>
  </symbol>

  <symbol id="ico-map" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/>
    <line x1="8" y1="2" x2="8" y2="18"/>
    <line x1="16" y1="6" x2="16" y2="22"/>
  </symbol>

  <symbol id="ico-compass" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="10"/>
    <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>
  </symbol>

  <symbol id="ico-calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
    <line x1="16" y1="2" x2="16" y2="6"/>
    <line x1="8"  y1="2" x2="8"  y2="6"/>
    <line x1="3"  y1="10" x2="21" y2="10"/>
  </symbol>

  <symbol id="ico-sparkle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3l2.4 6.6L21 12l-6.6 2.4L12 21l-2.4-6.6L3 12l6.6-2.4z"/>
  </symbol>

  <symbol id="ico-arrow-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="5" y1="12" x2="19" y2="12"/>
    <polyline points="12 5 19 12 12 19"/>
  </symbol>

  <symbol id="ico-book-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z"/>
    <path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/>
  </symbol>

</svg>
<!-- ── end SVG sprites ──────────────────────────────────────────────────── -->


<!-- Prototype banner — not part of production design -->
<div class="v2-proto-banner">
  <div class="v2-proto-banner__dot"></div>
  Prototype &mdash; Home V2 &mdash; read-only, no backend calls
</div>


<!-- ── Main app wrapper ─────────────────────────────────────────────────── -->
<div class="v2-app">

  <!-- ── 1. HERO ───────────────────────────────────────────────────────── -->
  <section class="v2-hero">
    <div class="v2-hero__inner">

      <div class="v2-hero__top">
        <!-- Greeting + name -->
        <div class="v2-hero__greeting">
          <span class="v2-hero__time" id="v2-time">Good morning</span>
          <h1 class="v2-hero__name" id="v2-name">Marko</h1>
          <div class="v2-hero__context">
            <span class="v2-hero__at" id="v2-at">at Antique Split</span>
            <span class="v2-hero__powered">powered by Olly</span>
          </div>
        </div>

        <!-- Weather pill -->
        <div class="v2-hero__weather" id="v2-weather-icon">
          <svg class="v2-icon v2-icon--sm"><use href="#ico-sun"/></svg>
          <span id="v2-temp">26&deg;</span>
          <span class="v2-hero__weather-city" id="v2-city">Split</span>
        </div>
      </div>

      <!-- Room &middot; type &middot; check-out strip -->
      <div class="v2-hero__room">
        <span id="v2-room">Room 201</span>
        <span class="v2-hero__sep">&middot;</span>
        <span id="v2-rtype">Deluxe</span>
        <span class="v2-hero__sep">&middot;</span>
        <span class="v2-hero__co-icon">
          <svg class="v2-icon v2-icon--xs"><use href="#ico-calendar"/></svg>
        </span>
        <span id="v2-checkout">Check-out Sat, 6 Jun</span>
      </div>

    </div>
  </section>


  <!-- ── 2. QUICK ACCESS ───────────────────────────────────────────────── -->
  <section class="v2-section">
    <div class="v2-tile-grid" id="v2-tile-grid">
      <!-- rendered by home-v2.js -->
    </div>
  </section>


  <!-- ── 3. STEPS FROM YOUR DOOR ──────────────────────────────────────── -->
  <section class="v2-section">
    <div class="v2-section-hd">
      <h2 class="v2-section-title">Steps from your door</h2>
      <button class="v2-see-all" onclick="v2Toast('Full map coming soon')">
        See all
        <svg class="v2-icon v2-icon--xs"><use href="#ico-arrow-right"/></svg>
      </button>
    </div>
    <div class="v2-poi-scroll" id="v2-poi-scroll">
      <!-- rendered by home-v2.js -->
    </div>
  </section>


  <!-- ── 4. SPLIT TODAY ───────────────────────────────────────────────── -->
  <section class="v2-section">
    <div class="v2-today-card" id="v2-today-card">
      <!-- rendered by home-v2.js -->
    </div>
  </section>


  <!-- ── 5. WHISPERS OF THE PALACE (conditional on hotel config) ──────── -->
  <section class="v2-section" id="v2-whispers-section">
    <div class="v2-section-hd">
      <h2 class="v2-section-title">Cultural Series</h2>
    </div>
    <div class="v2-whispers-card" id="v2-whispers-card"
         onclick="v2Toast('Whispers of the Palace &ndash; entering')">
      <!-- rendered by home-v2.js -->
    </div>
  </section>


  <!-- Bottom spacer (clears fixed nav) -->
  <div style="height:12px"></div>

</div>
<!-- ── end v2-app ──────────────────────────────────────────────────────── -->


<!-- ── Ask bubble (floating, fixed) ─────────────────────────────────── -->
<div class="v2-ask-wrap" id="v2-ask-wrap">
  <div class="v2-ask-tip" id="v2-ask-tip">
    Ask Dioclea anything about your stay.
  </div>
  <button class="v2-ask-bubble" id="v2-ask-bubble"
          aria-label="Ask Dioclea"
          onclick="v2AskTap()">
    <svg class="v2-icon v2-icon--md"><use href="#ico-sparkle"/></svg>
    <span class="v2-ask-dot"></span>
  </button>
</div>


<!-- ── Bottom nav ────────────────────────────────────────────────────── -->
<nav class="v2-bottom-nav">

  <button class="v2-nav-btn v2-nav-btn--active" data-tab="home">
    <svg class="v2-icon v2-icon--nav"><use href="#ico-home"/></svg>
    <span>Home</span>
  </button>

  <button class="v2-nav-btn" data-tab="map"
          onclick="v2Toast('Map &ndash; coming soon')">
    <svg class="v2-icon v2-icon--nav"><use href="#ico-map"/></svg>
    <span>Map</span>
  </button>

  <button class="v2-nav-btn" data-tab="tours"
          onclick="v2Toast('Tours &ndash; coming soon')">
    <svg class="v2-icon v2-icon--nav"><use href="#ico-compass"/></svg>
    <span>Tours</span>
  </button>

  <button class="v2-nav-btn" data-tab="today"
          onclick="v2Toast('Today &ndash; coming soon')">
    <svg class="v2-icon v2-icon--nav"><use href="#ico-sun"/></svg>
    <span>Today</span>
  </button>

</nav>


<!-- Toast -->
<div class="v2-toast" id="v2-toast"></div>


<script src="home-v2.js"></script>
</body>
</html>

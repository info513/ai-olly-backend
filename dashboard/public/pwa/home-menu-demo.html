<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a2234">
  <title>AI OLLY — Home (Demo)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="home-menu-demo.css">
</head>
<body>

  <!-- ── Brand Bar ─────────────────────────────────────────────── -->
  <header class="brand-bar">
    <div class="brand-lockup">
      <span class="brand-name">AI OLLY</span>
      <span class="brand-tagline">Guest Experience Assistant</span>
    </div>
    <span class="brand-hotel-badge">Antique Split</span>
  </header>

  <!-- ── Main scroll area ──────────────────────────────────────── -->
  <main class="main">

    <!-- Hero card -->
    <div class="hero-card">
      <span class="hero-label">Dioclea</span>
      <h1 class="hero-greeting" id="js-greeting">Good evening</h1>
      <p class="hero-hotel">Welcome to Antique Split</p>
      <p class="hero-sub">Your personal hotel guide is ready.</p>
    </div>

    <!-- Menu section -->
    <section class="menu-section">
      <h2 class="menu-heading">How can I help you?</h2>

      <div class="menu-grid">

        <!-- 1. Room Guide -->
        <button class="card" type="button">
          <div class="card-top">
            <span class="card-icon" aria-hidden="true">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="7.5" cy="15.5" r="5.5"/>
                <path d="m21 2-9.6 9.6"/>
                <path d="m15.5 7.5 3 3L22 7l-3-3"/>
              </svg>
            </span>
            <span class="card-chevron" aria-hidden="true">›</span>
          </div>
          <div class="card-body">
            <span class="card-title">Room Guide</span>
            <span class="card-sub">Room details, WiFi, TV, Safe</span>
          </div>
        </button>

        <!-- 2. Hotel Services -->
        <button class="card" type="button">
          <div class="card-top">
            <span class="card-icon" aria-hidden="true">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/>
                <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
              </svg>
            </span>
            <span class="card-chevron" aria-hidden="true">›</span>
          </div>
          <div class="card-body">
            <span class="card-title">Hotel Services</span>
            <span class="card-sub">Breakfast, luggage, comfort</span>
          </div>
        </button>

        <!-- 3. Map & Near Me -->
        <button class="card" type="button">
          <div class="card-top">
            <span class="card-icon" aria-hidden="true">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/>
                <circle cx="12" cy="10" r="3"/>
              </svg>
            </span>
            <span class="card-chevron" aria-hidden="true">›</span>
          </div>
          <div class="card-body">
            <span class="card-title">Map &amp; Near Me</span>
            <span class="card-sub">Places around the hotel</span>
          </div>
        </button>

        <!-- 4. Routes -->
        <button class="card" type="button">
          <div class="card-top">
            <span class="card-icon" aria-hidden="true">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="6" cy="19" r="3"/>
                <path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"/>
                <circle cx="18" cy="5" r="3"/>
              </svg>
            </span>
            <span class="card-chevron" aria-hidden="true">›</span>
          </div>
          <div class="card-body">
            <span class="card-title">Routes</span>
            <span class="card-sub">Curated walks in Split</span>
          </div>
        </button>

        <!-- 5. Concierge — navy emphasis -->
        <button class="card card--concierge" type="button">
          <div class="card-top">
            <span class="card-icon" aria-hidden="true">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
              </svg>
            </span>
            <span class="card-chevron" aria-hidden="true">›</span>
          </div>
          <div class="card-body">
            <span class="card-title">Concierge</span>
            <span class="card-sub">Human assistance &amp; arrangements</span>
          </div>
        </button>

        <!-- 6. Help & Requests -->
        <button class="card" type="button">
          <div class="card-top">
            <span class="card-icon" aria-hidden="true">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <rect width="8" height="4" x="8" y="2" rx="1" ry="1"/>
                <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
                <path d="M9 12h6"/>
                <path d="M9 16h4"/>
              </svg>
            </span>
            <span class="card-chevron" aria-hidden="true">›</span>
          </div>
          <div class="card-body">
            <span class="card-title">Help &amp; Requests</span>
            <span class="card-sub">Send a request to reception</span>
          </div>
        </button>

      </div>
    </section>

  </main>

  <!-- ── Bottom nav (visual mock) ──────────────────────────────── -->
  <nav class="bottom-nav" role="navigation" aria-label="Main navigation">

    <button class="nav-btn nav-btn--active" type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      <span>Home</span>
    </button>

    <button class="nav-btn" type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M2 20v-8a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v8"/>
        <path d="M2 14h20"/>
        <path d="M7 10V6.5a2.5 2.5 0 0 1 5 0V10"/>
        <path d="M12 10V6.5a2.5 2.5 0 0 1 5 0V10"/>
      </svg>
      <span>Room</span>
    </button>

    <button class="nav-btn" type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/>
        <circle cx="12" cy="10" r="3"/>
      </svg>
      <span>Map</span>
    </button>

    <button class="nav-btn" type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      <span>Ask</span>
    </button>

    <button class="nav-btn" type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10"/>
        <path d="M12 16v-4"/>
        <path d="M12 8h.01"/>
      </svg>
      <span>Info</span>
    </button>

  </nav>

  <!-- ── Floating Ask Dioclea button ───────────────────────────── -->
  <button class="ask-fab" type="button" aria-label="Ask Dioclea">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
    </svg>
    Ask
  </button>

  <script>
    // Set greeting based on current hour — no backend call needed
    (function () {
      var h = new Date().getHours();
      var g = h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
      var el = document.getElementById('js-greeting');
      if (el) el.textContent = g;
    }());
  </script>

</body>
</html>

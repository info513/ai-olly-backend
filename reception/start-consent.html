<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Priprema formulara za potpis – Hotel Antique Split</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 24px 16px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      padding: 40px 32px;
      width: 100%;
      max-width: 440px;
    }

    .logo {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 8px;
      line-height: 1.3;
    }

    .subtitle {
      font-size: 14px;
      color: #666;
      margin-bottom: 32px;
      line-height: 1.5;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #444;
      margin-bottom: 6px;
    }

    input[type="password"], input[type="text"] {
      width: 100%;
      padding: 14px 16px;
      font-size: 18px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.2s;
      letter-spacing: 0.15em;
    }
    input[type="password"]:focus, input[type="text"]:focus {
      border-color: #C8972B;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      font-size: 17px;
      font-weight: 700;
      background: #C8972B;
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 20px;
      transition: background 0.2s, opacity 0.2s;
    }
    .btn:hover { background: #b07e20; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-open {
      background: #1a6e3e;
      font-size: 20px;
      padding: 20px;
      margin-top: 28px;
      border-radius: 12px;
      text-decoration: none;
      display: block;
      text-align: center;
      color: #fff;
      font-weight: 700;
      transition: background 0.2s;
    }
    .btn-open:hover { background: #155c34; }

    .error {
      color: #c0392b;
      font-size: 14px;
      margin-top: 12px;
      padding: 12px 14px;
      background: #fdf0ef;
      border-radius: 8px;
      display: none;
    }

    .guest-info {
      background: #f0f7f4;
      border-radius: 10px;
      padding: 18px 20px;
      margin-top: 24px;
    }
    .guest-info h2 {
      font-size: 15px;
      font-weight: 600;
      color: #1a6e3e;
      margin-bottom: 10px;
    }
    .guest-info dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; }
    .guest-info dt { font-size: 13px; color: #666; font-weight: 500; }
    .guest-info dd { font-size: 14px; color: #1a1a1a; font-weight: 600; }

    #step-pin  { display: block; }
    #step-ready { display: none; }

    .spinner {
      display: inline-block;
      width: 20px; height: 20px;
      border: 3px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">Hotel Antique Split · Recepcija</div>

  <!-- Step 1: PIN entry -->
  <div id="step-pin">
    <h1>Priprema formulara za potpis</h1>
    <p class="subtitle">Unesite recepcijski PIN kako biste generirali formular za suglasnost gosta.</p>

    <label for="pin-input">Recepcijski PIN</label>
    <input type="password" id="pin-input" inputmode="numeric"
           placeholder="••••••••" autocomplete="off"
           onkeydown="if(event.key==='Enter') startConsent()" />

    <div class="error" id="error-msg"></div>

    <button class="btn" id="start-btn" onclick="startConsent()">Pripremi formular</button>
  </div>

  <!-- Step 2: Ready — show guest info + link -->
  <div id="step-ready">
    <h1>Formular je spreman</h1>
    <p class="subtitle">Predajte tablet gostu i zamolite ga da potpiše suglasnost.</p>

    <div class="guest-info">
      <h2>Podaci gosta</h2>
      <dl>
        <dt>Soba</dt>    <dd id="info-room">–</dd>
        <dt>Gost</dt>    <dd id="info-name">–</dd>
      </dl>
    </div>

    <a id="consent-link" class="btn-open" href="#" target="_blank">
      Otvori formular za potpis ›
    </a>
  </div>
</div>

<script>
  // Read stayId from URL ?stayId=...
  const params = new URLSearchParams(location.search);
  const stayId = (params.get('stayId') || '').trim();

  if (!stayId) {
    document.getElementById('error-msg').textContent =
      'Nedostaje stayId parametar u URL-u. Otvorite ovu stranicu iz Airtable sučelja.';
    document.getElementById('error-msg').style.display = 'block';
    document.getElementById('start-btn').disabled = true;
  }

  async function startConsent() {
    const pinInput = document.getElementById('pin-input');
    const errBox   = document.getElementById('error-msg');
    const btn      = document.getElementById('start-btn');
    const pin      = pinInput.value.trim();

    if (!pin) {
      errBox.textContent = 'Unesite recepcijski PIN.';
      errBox.style.display = 'block';
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Učitavam…';
    errBox.style.display = 'none';

    try {
      const resp = await fetch('/api/reception/init-consent', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ stayId, pin }),
      });
      const data = await resp.json();

      if (!data.ok) {
        throw new Error(data.error || 'Greška na serveru');
      }

      // Show step 2
      document.getElementById('info-room').textContent = data.room || '–';
      document.getElementById('info-name').textContent = data.name || '–';

      const fullConsentUrl = new URL(data.consentUrl, location.origin).href;
      document.getElementById('consent-link').href = fullConsentUrl;

      document.getElementById('step-pin').style.display   = 'none';
      document.getElementById('step-ready').style.display = 'block';

    } catch (e) {
      const msg = e.message === 'Forbidden'
        ? 'Pogrešan PIN. Pokušajte ponovo.'
        : (e.message || 'Nepoznata greška. Pokušajte ponovo.');
      errBox.textContent = msg;
      errBox.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Pripremi formular';
    }
  }
</script>
</body>
</html>
